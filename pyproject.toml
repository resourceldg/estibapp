[project]
name = "estiba"
version = "0.1.0"
description = "Convierte conversaciones de WhatsApp en fletes agendados. Local, libre y sin costo."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
estiba = "estiba.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/estiba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
