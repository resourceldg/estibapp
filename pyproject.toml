[project]
name = "estiba"
version = "0.1.0"
description = "Convierte conversaciones de WhatsApp en fletes agendados. Local, libre y sin costo."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.1"]
calendario = ["caldav>=1.4"]
informe = [
    "weasyprint>=70.0",
]

[project.scripts]
estiba = "estiba.cli:ejecutar"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8.0",
]
# Transcribir audios no es opcional en la compu de Estiba: si falta, Estiba queda sorda a los audios.
# Como grupo por defecto, `uv run` / `uv sync` lo instalan siempre (como extra, cada `uv run` lo borraba:
# del 7-oct al 18-nov no se transcribió ningún audio). El extra «audio» sigue para instalar con pip.
audio = ["faster-whisper>=1.1"]

[tool.uv]
default-groups = ["dev", "audio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/estiba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
