{% macro icono(nombre, clase="ico") -%}
<svg class="{{ clase }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if nombre == "bandeja" -%}
<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
{%- elif nombre == "camion" -%}
<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>
{%- elif nombre == "actualizar" -%}
<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/>
{%- elif nombre == "enviar" -%}
<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
{%- elif nombre == "copiar" -%}
<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
{%- elif nombre == "check" -%}
<path d="M20 6 9 17l-5-5"/>
{%- elif nombre == "flecha" -%}
<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
{%- elif nombre == "volver" -%}
<path d="m15 18-6-6 6-6"/>
{%- elif nombre == "aviso" -%}
<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>
{%- elif nombre == "mic" -%}
<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>
{%- elif nombre == "agenda" -%}
<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>
{%- elif nombre == "numeros" -%}
<path d="M3 3v18h18"/><path d="M7 16v-5"/><path d="M12 16V8"/><path d="M17 16v-9"/>
{%- elif nombre == "clientes" -%}
<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
{%- elif nombre == "hecho" -%}
<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
{%- elif nombre == "cruz" -%}
<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>
{%- elif nombre == "lapiz" -%}
<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
{%- elif nombre == "chat" -%}
<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro chip(etiqueta, tono) -%}
<span class="chip tono-{{ tono }}">{{ etiqueta }}</span>
{%- endmacro %}

{% macro marca() -%}
<svg class="marca-ico" viewBox="0 0 32 32" aria-hidden="true">
  <rect x="3" y="15" width="12" height="12" rx="2.5" fill="currentColor"/>
  <rect x="17" y="15" width="12" height="12" rx="2.5" fill="currentColor" opacity=".55"/>
  <rect x="10" y="3" width="12" height="10" rx="2.5" fill="var(--acento)"/>
</svg>
{%- endmacro %}
